# §62 · מנוע-המדידה-החי-הציבורי · economy-live
# מודד-את-השרשרת-ואת-דופק-הרץ בכל-ריצה → receipts/economy/latest.json (+history.jsonl)
# הקבלה-הציבורית-מתעדכנת-אוטומטית — אף-מספר-ציבורי-לא-נדחף-ידנית-עוד.
# הקומיט-נושא-[skip ci]-נגד-צ'רנה-ומצית-את-deploy-site-מיידית (פרסום-בדקות, לא-בשעה).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: economy-live
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: measure-chain-and-runner
        run: node ops/economy/live-measure.mjs
      - name: commit-receipt-and-publish-now
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "economy-live"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/economy/
          if git diff --cached --quiet; then
            echo "receipt identical — nothing to commit"
          else
            git commit -m "economy-live receipt $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-site.yml/dispatches" -f ref=main \
            && echo "deploy-site dispatched — public refresh in minutes"
