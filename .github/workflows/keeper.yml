name: keeper

# The scheduler problem, measured 2026-11-06: the uptime workflow's */15 cron
# fired exactly once in its first day (20:45 UTC; 13+ slots dropped) and the
# daily-proof 00:05 cron did not fire at all. GitHub cron is best-effort —
# the windows of gates 1.1 and 2.2 cannot be kept on hope.
#
# This workflow is the fix: ONE self-perpetuating keeper chain that
#   1. stands down if another keeper is alive or was seen younger than 180 s
#      (true duplicates overlap in real time; the legitimate successor sees
#      only its parent, completed ~13.5 min before — never counted),
#   2. re-dispatches uptime.yml if its last run is older than 20 minutes and
#      daily-proof.yml if its last run is older than 20 hours (a fresh daily
#      record for "today" always lands before the UTC date rolls over),
#   3. sleeps ~13 minutes, then dispatches its own successor. The handover
#      runs even if the watch step failed (continue-on-error) — a transient
#      API error kills a beat, never the chain.
# workflow_dispatch triggered by GITHUB_TOKEN is exempt from the
# "token events do not trigger workflows" rule, so the chain sustains itself.
# If the chain ever dies, the 6-hourly cron re-seeds it (best-effort) and a
# dropped beat stays a VISIBLE hole — that property is never given up.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: guard
        name: Single-chain guard — stand down if another keeper is alive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          # A handover child (workflow_dispatch) always has its parent as the
          # most recent other run — completed seconds ago, or still tearing
          # down. It is excluded (slice [1:]). A cron seed (schedule) gets no
          # exclusion: any live keeper makes it stand down.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tail_filter='[1:]'
          else
            tail_filter=''
          fi
          dup=$(gh api "repos/$REPO/actions/workflows/keeper.yml/runs?per_page=8" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)]$tail_filter | [.[] | select(.status != \"completed\" or ((now - (.created_at | fromdateiso8601)) < 180))] | length")
          echo "alive-or-young other keepers: $dup"
          if [ "$dup" -gt 0 ]; then
            echo "a keeper is already watching — standing down"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: beat
        name: Wake stale window workflows
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          wake () {
            wf="$1"; max="$2"
            last=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" \
              --jq '.workflow_runs[0].created_at // empty')
            if [ -z "$last" ]; then age=999999; else
              age=$(( $(date +%s) - $(date -u -d "$last" +%s) ))
            fi
            echo "$wf: last run $age s ago (threshold $max)"
            if [ "$age" -gt "$max" ]; then
              gh api -X POST "repos/$REPO/actions/workflows/$wf/dispatches" -f ref=main
              echo "$wf: stale — re-dispatched"
            fi
          }
          wake uptime.yml 1200
          wake daily-proof.yml 72000

      - name: Sleep, then hand over the watch
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sleep 780
          gh api -X POST "repos/$REPO/actions/workflows/keeper.yml/dispatches" -f ref=main
          echo "watch handed over"
