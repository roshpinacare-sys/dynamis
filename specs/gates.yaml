# Machine-readable phase gates — the only law of progress.
# Precedence: measured reality > params/genesis.yaml > CANON.md > this file > docs.
# A package closes only with evidence appended to specs/acceptance/EVIDENCE.md.

canon: CANON.md
params: params/genesis.yaml
evidence_file: specs/acceptance/EVIDENCE.md

phases:
  - id: phase-0
    name: Ignition
    weeks: [1, 2]
    packages:
      - {id: "0.1", owner: O, title: name clearance (trademark + domains),
         acceptance: "clearance recorded in specs/acceptance/0.1-clearance.md; no unresolved conflicts"}
      - {id: "0.2", owner: "O+A", title: two-soul custody for all new keys before code,
         acceptance: "census run exits 0; zero plaintext keys found on device scan"}
      - {id: "0.3", owner: "O+A", title: re-key or retire dead army (46 ROT2 WIFs, LOST-WITH-SANDBOX accounts); custom.db decision,
         acceptance: "CUSTODY.md updated; census roster matches; owner decision recorded"}
      - {id: "0.4", owner: O, title: ratify genesis params + ADRs 0001-0004,
         acceptance: "params/genesis.yaml committed; adr/0001..0004 status=accepted"}
      - {id: "0.5", owner: O, title: entity #1 charter (Law 20 object),
         acceptance: "params/entities/ent-001.yaml passes schema; regulator named"}
      - {id: "0.6", owner: A, title: resolve :3040 port collision,
         acceptance: "both services return /health 200 on distinct ports; params port table updated"}
    gate: all packages closed

  - id: phase-1
    name: Spark
    weeks: [3, 6]
    packages:
      - {id: "1.1", owner: "O+A", title: persistent host for 24/7 services,
         acceptance: "engine+hsm+economy uptime >= 99% measured over 7 consecutive days"}
      - {id: "1.2", owner: A, title: benchmark suite + challenge client on runner kit,
         acceptance: "3-5 devices enrolled; throughput tiering published from measured receipts"}
      - {id: "1.3", owner: A, title: finance spine v1 (chart of accounts, entity book, invoicing, anchoring),
         acceptance: "one invoice issued and settled end-to-end; digest anchored via batch notary"}
      - {id: "1.4", owner: A, title: worker registry + payroll streams,
         acceptance: "one agent salary paid as USDS stream and booked in entity ledger"}
      - {id: "1.5", owner: A, title: escrowed job market alpha (internal demand),
         acceptance: "first internal job settles via escrow with netrun receipt"}
      - {id: "1.6", owner: O, title: counsel engaged re entity wrapper,
         acceptance: "engagement letter; memo filed to specs/acceptance/"}
    gate: all packages closed

  - id: phase-2
    name: Grid
    weeks: [7, 16]
    packages:
      - {id: "2.1", owner: A, title: chain core (identity, work ledger, checkpoints, witness band v1),
         acceptance: "3 external honest devices verify; 1 seeded collusion caught"}
      - {id: "2.2", owner: A, title: flow-gated emission (Law 19),
         acceptance: "dashboard shows emitted == revenue-verified over >= 14 days"}
      - {id: "2.3", owner: A, title: Power Pool channels + attestation ladder A-E,
         acceptance: "class-C sampled re-execution catches a seeded fraud; pricing reflects class"}
      - {id: "2.4", owner: A, title: x402 endpoint + A2A cards + MCP job tools,
         acceptance: "external machine client completes a paid job via x402"}
      - {id: "2.5", owner: "O+A", title: entity #2 from template,
         acceptance: "day-one checklist measured < 1 day; separate book and keys live"}
      - {id: "2.6", owner: A, title: treasury policy engine (DoA classes, fail-closed),
         acceptance: "T2 spend blocked without regulator approval — measured test"}
    gate: all packages closed

  - id: phase-3
    name: Commonwealth
    weeks: [17, 24]
    packages:
      - {id: "3.1", owner: A, title: external witness operators (VRF + bonds),
         acceptance: ">= 3 external witnesses active for >= 14 days"}
      - {id: "3.2", owner: A, title: evaluation market with Brier-scored bonds,
         acceptance: "calibration report published (no-embarrassment clause honored)"}
      - {id: "3.3", owner: "O+A", title: entity fleet >= 3 + capital committee cadence,
         acceptance: "consolidated read-only regulator view live in giant@:3000"}
      - {id: "3.4", owner: O, title: governance amendment loop,
         acceptance: "one charter amendment executed end-to-end via veto + ADR"}
      - {id: "3.5", owner: A, title: ERC-8004 export bridge,
         acceptance: "agents discoverable externally; root has zero runtime dependency on bridge"}
    gate: all packages closed
